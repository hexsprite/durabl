name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the `engines.node: >=18` floor in package.json.
        node: ['18', '20', '22']

    env:
      # Absolute, workspace-relative: GitHub Actions does not expand `~` in
      # `env:`, and this value has to match the cache path exactly or the
      # download happens on every run despite a cache hit.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The Mongo-backed suites boot an in-memory replica set via
      # mongodb-memory-server, which downloads a mongod binary on first use.
      # Without this cache every job pays that download (~100MB) again.
      - name: Cache mongod binary
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build
