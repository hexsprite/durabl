name: Publish

# A pushed `v*` tag publishes that commit to npm. Nothing else reaches the
# registry: an ordinary push to main does not trigger this workflow at all, and
# a manual run stops before the publish step.
on:
  push:
    tags: ['v*']
  # Dry run. Exercises the gates and the release-notes extraction against any
  # branch, so the pipeline can be proven without spending a version number.
  workflow_dispatch:
    inputs:
      version:
        description: 'CHANGELOG version to extract notes for (dry run only)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # npm trusted publishing exchanges this OIDC token for a short-lived
      # registry credential. No NPM_TOKEN, no OTP prompt.
      id-token: write
      # Needed to create the GitHub Release for the tag.
      contents: write

    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later. The runner's bundled npm
      # trails that, so pin a known-good version instead of hoping.
      - run: npm install -g npm@latest

      - name: Cache mongod binary
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - run: npm ci

      # The tag is the release. If the gates fail here, nothing is published.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # On a tag, the tag must name the version in package.json. Without this
      # check a mistyped tag republishes the version already on the registry.
      # A dry run has no tag, so it takes the version from the input, falling
      # back to package.json.
      - name: Resolve version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$pkg" ]; then
              echo "tag v$version does not match package.json $pkg" >&2
              exit 1
            fi
          else
            version="${{ inputs.version }}"
            [ -n "$version" ] || version="$pkg"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "resolved version: $version"

      # The CHANGELOG section for this version becomes the release body, so the
      # notes stay hand-written in one place instead of being generated from
      # commit subjects. An empty section means the version was never written
      # up, which is worth failing on.
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG section for $VERSION" >&2
            exit 1
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish

      # Last, so a failed publish never leaves a release announcing a version
      # that is not on the registry.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

      - name: Dry run summary
        if: github.event_name != 'push'
        run: echo "Dry run for $VERSION. Gates and release notes verified; publish skipped."
